services:
  # ==========================================================
  # База данных — без изменений
  # ==========================================================
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always

  # ==========================================================
  # API Backend (FastAPI + uvicorn --reload)
  # ==========================================================
  api:
    build:
      context: ./repo
      dockerfile: ../Dockerfile.dev
    ports:
      - "5055:5055"
    volumes:
      - ./repo:/app
      - api_venv:/app/.venv
      - /app/frontend/node_modules
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=my-super-secret-key-ostap-2026
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - API_HOST=0.0.0.0
      - API_PORT=5055
      - API_RELOAD=true
    command: uv run uvicorn api.main:app --host 0.0.0.0 --port 5055 --reload --reload-dir /app
    depends_on:
      - surrealdb
    restart: unless-stopped

  # ==========================================================
  # Background Worker (обработчик фоновых задач)
  # ==========================================================
  worker:
    build:
      context: ./repo
      dockerfile: ../Dockerfile.dev
    volumes:
      - ./repo:/app
      - worker_venv:/app/.venv
      - /app/frontend/node_modules
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=my-super-secret-key-ostap-2026
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    command: uv run surreal-commands-worker --import-modules commands
    depends_on:
      - surrealdb
      - api
    restart: unless-stopped

  # ==========================================================
  # Frontend (Next.js dev server с HMR)
  # ==========================================================
  frontend:
    build:
      context: ./repo
      dockerfile: ../Dockerfile.dev
    ports:
      - "8502:3000"
    volumes:
      - ./repo:/app
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_venv:/app/.venv
    environment:
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=my-super-secret-key-ostap-2026
      - NEXT_PUBLIC_API_URL=http://localhost:5055
      - INTERNAL_API_URL=http://api:5055
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: bash -c "cd /app/frontend && npm install && npm run dev -- -p 3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_venv:
  worker_venv:
  frontend_venv:
  frontend_node_modules:
