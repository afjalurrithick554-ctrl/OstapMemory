<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist Block — Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg-deep: #0c0a14; --bg-mid: #15101f; --bg-glow: #2a1a4d;
    --accent-teal: #2ee6c8; --accent-teal-glow: rgba(46,230,200,0.45);
    --surface: rgba(255,255,255,0.05); --hairline: rgba(255,255,255,0.10); --hairline-strong: rgba(255,255,255,0.16);
    --text-primary: #f4f2fa; --text-tertiary: #716c8c;
    --checkbox-tick-color: #0c0a14;
    --radius-sm: 7px;
  }
  [data-theme="light"] {
    --bg-deep: #eef0f6; --bg-mid: #f5f6fb; --bg-glow: #e3defc;
    --accent-teal: #0fb8a0; --accent-teal-glow: rgba(15,184,160,0.35);
    --surface: rgba(20,15,40,0.035); --hairline: rgba(20,15,40,0.10); --hairline-strong: rgba(20,15,40,0.18);
    --text-primary: #1c1730; --text-tertiary: #8b86a3;
    --checkbox-tick-color: #ffffff;
    --radius-sm: 7px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
    padding: 32px;
  }

  /* ============ КОМПОНЕНТ: Checklist Block ============ */
  .checklist-block { margin-bottom: 26px; max-width: 480px; }
  .section-label {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-tertiary); margin-bottom: 11px; display: flex; align-items: center; gap: 7px;
  }
  .checklist-progress-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 11px; }
  .checklist-progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent-teal), #6ef5e0); box-shadow: 0 0 10px -1px var(--accent-teal-glow); }
  .checklist-item { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 8px; transition: background .15s ease; }
  .checklist-item:hover { background: rgba(255,255,255,0.04); }
  .checklist-item input[type="checkbox"] {
    width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--hairline-strong);
    background: transparent; appearance: none; cursor: pointer; flex-shrink: 0; position: relative;
    transition: background .15s ease, border-color .15s ease;
  }
  .checklist-item input[type="checkbox"]:checked { background: var(--accent-teal); border-color: var(--accent-teal); }
  .checklist-item input[type="checkbox"]:checked::after {
    content: ""; position: absolute; left: 5px; top: 1.5px; width: 5px; height: 9px;
    border: solid var(--checkbox-tick-color); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .checklist-item span { font-size: 13.5px; color: var(--text-primary); }
  .checklist-item.is-done span { color: var(--text-tertiary); text-decoration: line-through; }
  /* ============ /КОМПОНЕНТ ============ */

  .demo-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .demo-sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 28px; }
  .theme-toggle {
    display: inline-block; margin-bottom: 28px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-sm);
    padding: 8px 14px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-weight: 600;
  }
</style>
</head>
<body>

  <div class="demo-title">Checklist Block</div>
  <div class="demo-sub">Чек-лист с прогресс-баром — используется внутри модального окна задачи</div>
  <div class="theme-toggle" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">🌓 Тема</div>

  <div class="checklist-block">
    <div class="section-label">
      <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Чек-лист · <span id="progress-label">2/3</span>
    </div>
    <div class="checklist-progress-track">
      <div class="checklist-progress-fill" id="progress-fill" style="width: 66%;"></div>
    </div>
    <label class="checklist-item is-done">
      <input type="checkbox" checked onchange="updateProgress()">
      <span>Поднять статический домен ngrok</span>
    </label>
    <label class="checklist-item is-done">
      <input type="checkbox" checked onchange="updateProgress()">
      <span>Обновить webhook URL в YouGile</span>
    </label>
    <label class="checklist-item">
      <input type="checkbox" onchange="updateProgress()">
      <span>Проверить доставку тестового события</span>
    </label>
  </div>

  <script>
    // Прогресс-бар и счётчик пересчитываются от фактического числа отмеченных пунктов.
    function updateProgress() {
      var items = document.querySelectorAll('.checklist-item');
      var total = items.length;
      var done = 0;
      items.forEach(function (item) {
        var checked = item.querySelector('input').checked;
        item.classList.toggle('is-done', checked);
        if (checked) done++;
      });
      document.getElementById('progress-label').textContent = done + '/' + total;
      document.getElementById('progress-fill').style.width = (done / total * 100) + '%';
    }
  </script>

</body>
</html>
