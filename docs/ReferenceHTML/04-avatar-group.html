<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Group — Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg-deep: #0c0a14; --bg-mid: #15101f; --bg-glow: #2a1a4d;
    --avatar-border: var(--bg-mid);
    --task-card-assignee-border: #1c1530;
    --surface: rgba(255,255,255,0.05); --hairline: rgba(255,255,255,0.10);
    --text-primary: #f4f2fa; --text-tertiary: #716c8c;
    --radius-sm: 7px; --radius-md: 12px;
  }
  [data-theme="light"] {
    --bg-deep: #eef0f6; --bg-mid: #f5f6fb; --bg-glow: #e3defc;
    --avatar-border: #ffffff;
    --task-card-assignee-border: #ffffff;
    --surface: rgba(20,15,40,0.035); --hairline: rgba(20,15,40,0.10);
    --text-primary: #1c1730; --text-tertiary: #8b86a3;
    --radius-sm: 7px; --radius-md: 12px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
    padding: 32px;
  }

  /* ============ КОМПОНЕНТ: Avatar Group ============ */
  /* Вариант 1: крупная группа (шапка приложения) */
  .avatar-group { display: flex; align-items: center; }
  .avatar-group img {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--avatar-border);
    margin-left: -8px;
    object-fit: cover;
  }
  .avatar-group img:first-child { margin-left: 0; }

  /* Вариант 2: компактная группа (на карточке задачи) */
  .task-card__assignees { display: flex; align-items: center; }
  .task-card__assignees img {
    width: 21px; height: 21px;
    border-radius: 50%;
    border: 1.5px solid var(--task-card-assignee-border);
    margin-left: -6px;
    object-fit: cover;
  }
  .task-card__assignees img:first-child { margin-left: 0; }
  /* ============ /КОМПОНЕНТ ============ */

  .demo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .demo-title { font-size: 20px; font-weight: 700; }
  .demo-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }
  .theme-toggle {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-sm);
    padding: 8px 14px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-weight: 600;
  }
  .demo-block { border: 1px solid var(--hairline); border-radius: 14px; padding: 20px; background: var(--surface); margin-bottom: 16px; }
  .demo-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-tertiary); margin-bottom: 16px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 32px; align-items: center; }
  code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

  <div class="demo-header">
    <div>
      <div class="demo-title">Avatar Group</div>
      <div class="demo-sub">Перекрывающиеся круглые аватары — крупный (шапка) и компактный (карточка) вариант</div>
    </div>
    <div class="theme-toggle" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">🌓 Тема</div>
  </div>

  <div class="demo-block">
    <div class="demo-label">Крупный вариант — .avatar-group (шапка приложения)</div>
    <div class="demo-row">
      <div class="avatar-group">
        <img src="https://i.pravatar.cc/150?img=11" alt="">
        <img src="https://i.pravatar.cc/150?img=12" alt="">
        <img src="https://i.pravatar.cc/150?img=33" alt="">
      </div>
      <div class="avatar-group">
        <img src="https://i.pravatar.cc/150?img=11" alt="">
      </div>
    </div>
  </div>

  <div class="demo-block">
    <div class="demo-label">Компактный вариант — .task-card__assignees (карточка задачи)</div>
    <div class="demo-row">
      <div class="task-card__assignees">
        <img src="https://i.pravatar.cc/150?img=11" alt="">
        <img src="https://i.pravatar.cc/150?img=12" alt="">
      </div>
      <div class="task-card__assignees">
        <img src="https://i.pravatar.cc/150?img=33" alt="">
      </div>
    </div>
  </div>

  <div class="demo-block">
    <div class="demo-label">Разметка</div>
    <code>&lt;div class="avatar-group"&gt;&lt;img src="..."&gt;&lt;img src="..."&gt;&lt;/div&gt;</code>
  </div>

</body>
</html>
