<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Header — Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg-deep: #0c0a14; --bg-mid: #15101f; --bg-glow: #2a1a4d;
    --accent-purple: #7c3ef0; --accent-purple-light: #b06ef5; --accent-purple-deep: #2e0f8f;
    --header-bg: rgba(12,10,20,0.5); --avatar-border: var(--bg-mid);
    --surface: rgba(255,255,255,0.05); --surface-hover: rgba(255,255,255,0.08); --surface-active: rgba(255,255,255,0.11);
    --hairline: rgba(255,255,255,0.10); --hairline-strong: rgba(255,255,255,0.16);
    --text-primary: #f4f2fa; --text-tertiary: #716c8c;
    --radius-sm: 7px;
  }
  [data-theme="light"] {
    --bg-deep: #eef0f6; --bg-mid: #f5f6fb; --bg-glow: #e3defc;
    --accent-purple: #7c3ef0; --accent-purple-light: #6e2fe0; --accent-purple-deep: #ad8af2;
    --header-bg: rgba(255,255,255,0.6); --avatar-border: #ffffff;
    --surface: rgba(20,15,40,0.035); --surface-hover: rgba(20,15,40,0.06); --surface-active: rgba(20,15,40,0.09);
    --hairline: rgba(20,15,40,0.10); --hairline-strong: rgba(20,15,40,0.18);
    --text-primary: #1c1730; --text-tertiary: #8b86a3;
    --radius-sm: 7px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
  }

  /* ============ КОМПОНЕНТ: App Header ============ */
  .app-header {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--header-bg);
    backdrop-filter: blur(12px);
  }
  .app-header__left { display: flex; align-items: center; gap: 14px; }
  .app-logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(155deg, var(--accent-purple-light), var(--accent-purple-deep));
    box-shadow: 0 0 16px -2px rgba(124,62,240,0.6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
  }
  .board-title { font-size: 15px; font-weight: 600; }
  .board-title__sub { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }

  .app-header__right { display: flex; align-items: center; gap: 10px; }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-sm);
    padding: 7px 12px; width: 220px; transition: border-color .15s ease, background .15s ease;
  }
  .search-box:hover { background: var(--surface-hover); }
  .search-box:focus-within { border-color: var(--accent-purple); box-shadow: 0 0 0 3px rgba(124,62,240,0.18); }
  .search-box svg { width: 14px; height: 14px; color: var(--text-tertiary); flex-shrink: 0; }
  .search-box input { background: none; border: none; outline: none; color: var(--text-primary); font-size: 13px; width: 100%; font-family: inherit; }
  .search-box input::placeholder { color: var(--text-tertiary); }

  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: var(--surface); border: 1px solid var(--hairline);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-tertiary); cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); border-color: var(--hairline-strong); }
  .icon-btn:active { background: var(--surface-active); }
  .icon-btn svg { width: 16px; height: 16px; }

  .avatar-group { display: flex; align-items: center; }
  .avatar-group img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--avatar-border); margin-left: -8px; object-fit: cover; }
  .avatar-group img:first-child { margin-left: 0; }
  /* ============ /КОМПОНЕНТ ============ */

  .demo-wrap { padding: 32px; }
  .demo-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .demo-sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 24px; }
</style>
</head>
<body>

  <header class="app-header">
    <div class="app-header__left">
      <div class="app-logo">Т</div>
      <div>
        <div class="board-title">Доска Архитектуры</div>
        <div class="board-title__sub">Emigrants 360° · Phase 2</div>
      </div>
    </div>
    <div class="app-header__right">
      <div class="search-box">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" placeholder="Поиск задач...">
      </div>
      <div class="icon-btn" title="Тема" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </div>
      <div class="icon-btn" title="Фильтры">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M6 12h12M10 20h4"/></svg>
      </div>
      <div class="icon-btn" title="Настройки">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div class="avatar-group">
        <img src="https://i.pravatar.cc/150?img=11" alt="">
        <img src="https://i.pravatar.cc/150?img=12" alt="">
        <img src="https://i.pravatar.cc/150?img=33" alt="">
      </div>
    </div>
  </header>

  <div class="demo-wrap">
    <div class="demo-title">App Header</div>
    <div class="demo-sub">Шапка приложения — лого/название, поиск, иконки-кнопки, переключатель темы, группа аватаров</div>
  </div>

</body>
</html>
