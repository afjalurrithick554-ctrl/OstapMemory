<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Tabs — Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg-deep: #0c0a14; --bg-mid: #15101f; --bg-glow: #2a1a4d;
    --accent-purple: #7c3ef0; --accent-purple-light: #b06ef5; --accent-teal: #2ee6c8;
    --priority-mid: #ffe45e;
    --surface: rgba(255,255,255,0.05); --hairline: rgba(255,255,255,0.10);
    --text-primary: #f4f2fa; --text-secondary: #a9a4c2; --text-tertiary: #716c8c;
    --status-tab-active-color: #fff;
  }
  [data-theme="light"] {
    --bg-deep: #eef0f6; --bg-mid: #f5f6fb; --bg-glow: #e3defc;
    --accent-purple: #7c3ef0; --accent-purple-light: #6e2fe0; --accent-teal: #0fb8a0;
    --priority-mid: #d9a300;
    --surface: rgba(20,15,40,0.035); --hairline: rgba(20,15,40,0.10);
    --text-primary: #1c1730; --text-secondary: #5d5878; --text-tertiary: #8b86a3;
    --status-tab-active-color: #ffffff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ============ КОМПОНЕНТ: Status Tabs ============ */
  /* Используется на мобильном (≤1024px) вместо горизонтального скролла колонок: */
  /* пользователь переключается между статусами через вкладки, видна одна колонка. */
  .status-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    overflow-x: auto;
    border-bottom: 1px solid var(--hairline);
  }
  .status-tabs::-webkit-scrollbar { display: none; }
  .status-tab {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--hairline);
    font-size: 12.5px; font-weight: 600; color: var(--text-secondary);
    white-space: nowrap; cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .status-tab__dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .status-tab__count { font-size: 11px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; }
  .status-tab.is-active { background: rgba(124,62,240,0.18); border-color: rgba(176,110,245,0.45); color: var(--status-tab-active-color); }
  .status-tab.is-active .status-tab__count { color: var(--accent-purple-light); }
  /* ============ /КОМПОНЕНТ ============ */

  .demo-wrap { padding: 32px; }
  .demo-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .demo-sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 20px; }
  .theme-toggle {
    display: inline-block; margin-top: 16px;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 7px;
    padding: 8px 14px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-weight: 600;
  }
  .panel-preview {
    margin-top: 16px; padding: 24px; border: 1px dashed var(--hairline); border-radius: 14px;
    font-size: 13px; color: var(--text-secondary); min-height: 80px;
  }
</style>
</head>
<body>

  <div class="status-tabs" id="demo-tabs">
    <div class="status-tab is-active" data-panel="backlog" onclick="switchTab(this)">
      <span class="status-tab__dot" style="background:#716c8c"></span>
      Backlog <span class="status-tab__count">8</span>
    </div>
    <div class="status-tab" data-panel="progress" onclick="switchTab(this)">
      <span class="status-tab__dot" style="background:var(--accent-purple)"></span>
      В процессе <span class="status-tab__count">12</span>
    </div>
    <div class="status-tab" data-panel="review" onclick="switchTab(this)">
      <span class="status-tab__dot" style="background:var(--priority-mid)"></span>
      Ревью <span class="status-tab__count">3</span>
    </div>
    <div class="status-tab" data-panel="done" onclick="switchTab(this)">
      <span class="status-tab__dot" style="background:var(--accent-teal)"></span>
      Готово <span class="status-tab__count">21</span>
    </div>
  </div>

  <div class="demo-wrap">
    <div class="demo-title">Status Tabs</div>
    <div class="demo-sub">Вкладки переключения колонок на мобильном (≤1024px) — заменяют горизонтальный скролл доски</div>

    <div class="panel-preview" id="panel-preview">Выбран статус: <b>Backlog</b></div>
  </div>

  <script>
    var labels = { backlog: 'Backlog', progress: 'В процессе', review: 'Ревью', done: 'Готово' };
    function switchTab(tabEl) {
      document.querySelectorAll('.status-tab').forEach(function (t) { t.classList.remove('is-active'); });
      tabEl.classList.add('is-active');
      document.getElementById('panel-preview').innerHTML = 'Выбран статус: <b>' + labels[tabEl.dataset.panel] + '</b>';
    }
  </script>

</body>
</html>
