<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priority Pin — Табло</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg-deep: #0c0a14; --bg-mid: #15101f; --bg-glow: #2a1a4d;
    --priority-high: #ff5ec4; --priority-mid: #ffe45e; --priority-low: #5ef0ff;
    --surface: rgba(255,255,255,0.05); --hairline: rgba(255,255,255,0.10);
    --text-primary: #f4f2fa; --text-tertiary: #716c8c;
    --radius-sm: 7px; --radius-md: 12px;
  }
  [data-theme="light"] {
    --bg-deep: #eef0f6; --bg-mid: #f5f6fb; --bg-glow: #e3defc;
    --priority-high: #e0398d; --priority-mid: #d9a300; --priority-low: #0a9fc7;
    --surface: rgba(20,15,40,0.035); --hairline: rgba(20,15,40,0.10);
    --text-primary: #1c1730; --text-tertiary: #8b86a3;
    --radius-sm: 7px; --radius-md: 12px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 15% 0%, var(--bg-glow) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-primary);
    padding: 32px;
  }

  /* ============ КОМПОНЕНТ: Priority Pin ============ */
  .priority-pin {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
  }
  .priority-pin--high { background: var(--priority-high); box-shadow: 0 0 7px 1px rgba(255,94,196,0.7); }
  .priority-pin--mid { background: var(--priority-mid); box-shadow: 0 0 7px 1px rgba(255,228,94,0.6); }
  .priority-pin--low { background: var(--priority-low); box-shadow: 0 0 7px 1px rgba(94,240,255,0.6); }
  /* Позиционирование "точкой в углу карточки" — модификатор использования, не сам компонент */
  .priority-pin--corner { position: absolute; top: 10px; right: 11px; }
  /* ============ /КОМПОНЕНТ ============ */

  .demo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .demo-title { font-size: 20px; font-weight: 700; }
  .demo-sub { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }
  .theme-toggle {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-sm);
    padding: 8px 14px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-weight: 600;
  }
  .demo-block { border: 1px solid var(--hairline); border-radius: 14px; padding: 20px; background: var(--surface); margin-bottom: 16px; }
  .demo-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-tertiary); margin-bottom: 16px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
  .demo-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-primary); }

  .mini-card {
    position: relative;
    width: 160px; height: 80px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-md);
    padding: 12px;
    font-size: 12px;
    color: var(--text-tertiary);
  }
  code { background: var(--surface); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

  <div class="demo-header">
    <div>
      <div class="demo-title">Priority Pin</div>
      <div class="demo-sub">Индикатор приоритета задачи — точка с подсветкой</div>
    </div>
    <div class="theme-toggle" onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">🌓 Тема</div>
  </div>

  <div class="demo-block">
    <div class="demo-label">Варианты</div>
    <div class="demo-row">
      <div class="demo-item"><span class="priority-pin priority-pin--high"></span> Высокий</div>
      <div class="demo-item"><span class="priority-pin priority-pin--mid"></span> Средний</div>
      <div class="demo-item"><span class="priority-pin priority-pin--low"></span> Низкий</div>
    </div>
  </div>

  <div class="demo-block">
    <div class="demo-label">В контексте карточки (модификатор --corner)</div>
    <div class="demo-row">
      <div class="mini-card">
        <span class="priority-pin priority-pin--high priority-pin--corner"></span>
        Карточка задачи
      </div>
      <div class="mini-card">
        <span class="priority-pin priority-pin--mid priority-pin--corner"></span>
        Карточка задачи
      </div>
      <div class="mini-card">
        <span class="priority-pin priority-pin--low priority-pin--corner"></span>
        Карточка задачи
      </div>
    </div>
  </div>

  <div class="demo-block">
    <div class="demo-label">Разметка</div>
    <code>&lt;span class="priority-pin priority-pin--high"&gt;&lt;/span&gt;</code>
  </div>

</body>
</html>
